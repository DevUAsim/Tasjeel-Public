[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasjeel"
version = "2.0.0"
description = "Offline-first desktop voice transcription built on Faster-Whisper and PyQt6."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Umer Asim" }]
keywords = ["speech-to-text", "transcription", "whisper", "pyqt6", "desktop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "PyQt6>=6.6",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pydub>=0.25",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "librosa>=0.10",
    "faster-whisper>=1.1",
    "tqdm>=4.66",
    "google-generativeai>=0.8",
    "cryptography>=42",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
dev = ["pytest>=8"]

[project.scripts]
tasjeel = "tasjeel.__main__:main"

[project.urls]
Repository = "https://github.com/DevUAsim/Tasjeel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tasjeel = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
