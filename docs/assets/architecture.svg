    <text x="438" y="140">PCM audio</text>
    <text x="878" y="118">local</text>
    <text x="864" y="174">cloud</text>
    <text x="768" y="258">segments</text>
  </g>

  <g fill="#141414" stroke="#2c2c2c" stroke-width="1.2">
