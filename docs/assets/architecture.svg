<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>Tasjeel architecture</title>
  <desc>Microphone audio flows through AudioRecorder, and audio files through AudioFileLoader, into RecordingController and the Transcriber. The Transcriber uses Faster-Whisper locally or Google Gemini in the cloud, and streams segments to MainContentPanel, which feeds ExportManager and SessionManager. AudioRecorder also drives the LevelMeter.</desc>
